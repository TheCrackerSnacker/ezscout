name: ezscout-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezscout}
      POSTGRES_DB: ${POSTGRES_DB:-ezscout}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ezscout} -d ${POSTGRES_DB:-ezscout}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ezscout}:${POSTGRES_PASSWORD:-ezscout}@postgres:5432/${POSTGRES_DB:-ezscout}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_KEY: ${SESSION_KEY:-}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
    ports:
      - "${HOST_PROD_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
