server {
  listen 80;
  server_name _;

  # Security headers. `add_header` is inherited by the location blocks below.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Enable once this is fronted by TLS (ignored over plain HTTP):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API runs `trustProxy: 1`, so it trusts this single hop and reads the
    # first entry of X-Forwarded-For as the client IP (per-IP rate limits are
    # keyed on it). Overwrite the header with $remote_addr instead of
    # appending, so clients can't spoof a fresh rate-limit bucket via inbound
    # X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite hashes all build assets, so immutable caching is safe; the HTML shell
  # must always revalidate so clients pick up new bundles (esp. non-SW phones).
  # `expires` is used (not add_header) so it doesn't reset inherited headers.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
